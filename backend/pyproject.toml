[project]
name = "fpl-assistant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "numpy>=2,<3", "pandas>=2.2,<3", "pyarrow>=19,<24", "scipy>=1.15,<2", "catboost>=1.2.7,<2", "highspy>=1.9,<2"]
[project.optional-dependencies]
bayes = ["pymc>=5.20,<6", "arviz>=0.21,<1"]
deep = ["torch>=2.6,<3", "pytorch-forecasting>=1.3,<2", "lightning>=2.5,<3"]
rl = [
    "gymnasium>=1.2,<2",
    "sb3-contrib>=2.7,<3",
    "stable-baselines3>=2.7,<3",
]
[dependency-groups]
dev = ["pytest>=8.3,<9", "hypothesis>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "pandas-stubs>=2.2,<3"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/fpl_app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
